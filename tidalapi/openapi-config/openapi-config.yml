templateDir: openapi-config/templates
globalProperties:
  apiTests: false
  modelTests: false
  apiDocs: false
  modelDocs: false
additionalProperties:
  artifactId: tidalapi.generated
  packageName: com.tidal.sdk.tidalapi.generated
  apiNameSuffix: ''
  apiSuffix: ''
  removeEnumValuePrefix: true
  groupId: com.tidal.sdk
  library: jvm-retrofit2
  serializationLibrary: kotlinx_serialization
  dateLibrary: string
  supportAndroidApiLevel25AndBelow: true
  useCoroutines: true
  omitGradleWrapper: true
files:
  Client.kt.mustache:
    templateType: SupportingFiles
    destinationFilename: src/main/kotlin/com/tidal/sdk/tidalapi/generated/ApiClient.kt
typeMappings:
  URI: kotlin.String
  UUID: kotlin.String
  object: JsonObject
  AnyType: JsonElement
importMappings:
  JsonObject: kotlinx.serialization.json.JsonObject
  JsonElement: kotlinx.serialization.json.JsonElement
languageSpecificPrimitives:
  - JsonObject
  - JsonElement
  - kotlinx.serialization.json.JsonObject
  - kotlinx.serialization.json.JsonElement
